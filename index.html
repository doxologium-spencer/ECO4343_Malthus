<title>The Lottery of Life: A Two-Player Malthus Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1f1d24; --paper:#ece6d9; --panel:#f6f2ea; --soot:#3a3842; --brick:#8e3b2c;
  --wheat:#b8902f; --muted:#6a6572; --line:#cfc6b5; --lab:#6b4a2b; --own:#23324a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#ece6d9; --paper:#1c1b20; --panel:#26242c; --soot:#d0cbc2; --brick:#d0735d;
    --wheat:#d9b35a; --muted:#a39dab; --line:#3d3a45; --lab:#c99b6c; --own:#8fa8d1;
  }
}
:root[data-theme="dark"]{
  --ink:#ece6d9; --paper:#1c1b20; --panel:#26242c; --soot:#d0cbc2; --brick:#d0735d;
  --wheat:#d9b35a; --muted:#a39dab; --line:#3d3a45; --lab:#c99b6c; --own:#8fa8d1;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:Spectral,Georgia,"Times New Roman",serif;font-size:17px;line-height:1.6;display:flex;flex-direction:column}
h1,h2,h3{font-family:"IM Fell English",Georgia,serif;font-weight:400;line-height:1.15;margin:0}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--wheat);outline-offset:2px}

/* Stage */
#stage{position:relative;height:52vh;min-height:280px;max-height:560px;overflow:hidden;background:#9fb6c9;flex:none}
#track{position:absolute;inset:0;display:flex;transition:transform 1.6s cubic-bezier(.45,.05,.3,1)}
.panel{flex:0 0 100%;height:100%;position:relative}
.panel svg{width:100%;height:100%;display:block}
#plate{position:absolute;left:12px;top:12px;max-width:min(78%,420px);background:rgba(246,242,234,.92);color:#1f1d24;border-left:4px solid #8e3b2c;padding:6px 10px;font-size:14px;line-height:1.35;transition:opacity .4s}
#plate b{font-family:"IM Fell English",Georgia,serif;font-weight:400;font-size:18px;display:block}
#chars{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);display:flex;gap:24px;align-items:flex-end;pointer-events:none}
#chars svg{height:clamp(110px,min(26vh,36vw),210px);width:auto;display:block}
#chars.walk .fig{animation:bob .38s ease-in-out infinite alternate}
#chars.walk .fig:nth-child(2){animation-delay:.19s}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
.tag{position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-size:12px;background:#1f1d24;color:#ece6d9;padding:0 6px;white-space:nowrap}
.fig{position:relative}
.fig.active .tag{background:#b8902f;color:#1f1d24;font-weight:600}
.fig::before{content:"";position:absolute;left:50%;bottom:-10px;width:150%;height:34px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(255,214,110,.95),rgba(255,190,60,.45) 55%,rgba(255,190,60,0));opacity:0;transition:opacity .4s;z-index:-1}
.fig.active::before{opacity:1;animation:glow 1.4s ease-in-out infinite alternate}
.fig:not(.active){filter:saturate(.6) brightness(.85)}
@keyframes glow{from{transform:translateX(-50%) scale(.9)}to{transform:translateX(-50%) scale(1.1)}}

/* Meters */
#meters{position:absolute;right:12px;top:12px;display:grid;gap:6px;width:min(40%,190px);font-size:12px;color:#1f1d24}
.meter{background:rgba(246,242,234,.92);padding:4px 8px}
.bar{height:6px;background:#cfc6b5;margin-top:3px}
.bar i{display:block;height:100%;transition:width 1s}

/* Card */
#card{flex:1;padding:22px 18px 32px;overflow:auto}
.wrap{max-width:680px;margin:0 auto}
.who{font-size:15px;color:var(--muted);margin:0 0 4px}
.who strong{color:var(--ink);font-weight:600}
h2{font-size:clamp(26px,5vw,34px);margin-bottom:10px}
.context{margin:0 0 16px}
.prompt{font-style:italic;margin:0 0 12px}
.choices{display:grid;gap:10px}
.choice{text-align:left;border:1.5px solid var(--ink);background:var(--panel);color:var(--ink);padding:14px 16px;border-radius:2px;transition:transform .15s,background .15s}
.choice:hover:not(:disabled){transform:translateX(4px);background:var(--paper)}
.choice:disabled{opacity:.45;cursor:not-allowed}
.choice.picked{background:var(--ink);color:var(--paper);opacity:1}
.waiting{color:var(--muted);font-style:italic;margin-top:10px}
.outcome{border-left:4px solid var(--brick);padding:4px 0 4px 14px;margin:18px 0}
.quote{font-family:"IM Fell English",Georgia,serif;font-size:19px;font-style:italic;margin:14px 0 4px}
.cite{font-size:14px;color:var(--muted);margin:0 0 16px}
.lesson{background:var(--panel);border:1px solid var(--line);padding:12px 14px;font-size:15px}
.lesson h3{font-size:18px;margin-bottom:4px}
.primary{background:var(--brick);color:#fff;border:0;padding:12px 20px;margin-top:18px;border-radius:2px}
.secondary{background:transparent;color:var(--ink);border:1.5px solid var(--ink);padding:11px 18px;border-radius:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input.code{font:inherit;font-size:22px;letter-spacing:.3em;text-transform:uppercase;width:8.5em;padding:8px 10px;border:1.5px solid var(--ink);background:var(--panel);color:var(--ink);border-radius:2px}
.bigcode{font-family:"IM Fell English",Georgia,serif;font-size:48px;letter-spacing:.2em}
.err{color:var(--brick);font-weight:600}
.small{font-size:14px;color:var(--muted)}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.roles button{border:1.5px solid var(--ink);background:var(--panel);color:var(--ink);padding:14px;text-align:left;border-radius:2px}
.roles button span{display:block;font-size:14px;color:var(--muted)}
ul.take{padding-left:1.2em}
#victory{position:absolute;left:42%;top:12%;transform:translateX(-50%) scale(.6);opacity:0;text-align:center;pointer-events:none;transition:opacity .6s,transform .8s cubic-bezier(.3,1.5,.5,1);z-index:2;width:92%}
#victory.show{opacity:1;transform:translateX(-50%) scale(1)}
#victory b{display:block;font-family:"IM Fell English",Georgia,serif;font-weight:400;font-size:clamp(40px,9vw,92px);line-height:1;color:#f3cf6a;text-shadow:0 3px 0 #5a3c0c,0 0 24px rgba(0,0,0,.6)}
#victory span{display:inline-block;margin-top:8px;background:#1f1d24;color:#ece6d9;padding:2px 10px;font-size:clamp(14px,2.4vw,18px)}
.fig.win{transform:translateY(-10px) scale(1.12)}
.fig.lose{filter:grayscale(1) brightness(.6);transform:translateY(6px) scale(.92)}
.fig{transition:transform .8s,filter .8s}
#malthus{position:absolute;right:-2%;bottom:0;height:88%;display:flex;align-items:flex-end;pointer-events:none;transform:translateX(115%) rotate(0deg);transform-origin:100% 100%;transition:transform .7s cubic-bezier(.3,1.4,.5,1);z-index:3}
#malthus.show{transform:translateX(0) rotate(-7deg)}
#bubble{transition:opacity .2s}
#malthus:not(.show) #bubble{opacity:0;visibility:hidden}
#malthus svg{height:100%;width:auto;display:block}
#bubble{position:absolute;right:92%;top:6%;width:min(58vw,300px);background:#fffdf7;color:#1f1d24;border:2px solid #1f1d24;border-radius:16px;padding:10px 14px;font-family:"IM Fell English",Georgia,serif;font-size:clamp(15px,2.4vw,19px);line-height:1.3;transform:rotate(7deg);box-shadow:3px 3px 0 #1f1d24}
#bubble::after{content:"";position:absolute;right:-14px;bottom:18px;border:10px solid transparent;border-left:16px solid #1f1d24}
#bubble small{display:block;font-family:Spectral,Georgia,serif;font-size:12px;color:#6a6572;margin-top:4px}
@media (max-width:600px){#malthus{height:52%;right:-4%}#bubble{right:62%;top:-38%;width:min(62vw,250px)}#victory{top:22%;left:50%}#victory span{display:none}#meters{top:auto;bottom:8px;left:8px;right:auto;width:104px;font-size:11px}#plate{max-width:calc(100% - 24px)}}
@media (prefers-reduced-motion: reduce){#malthus{transition:none}}
@media (prefers-reduced-motion: reduce){
  #track{transition:none} #chars.walk .fig{animation:none} .fig.active::before{animation:none} .bar i{transition:none}
}
</style>
</head>

function sky(top,bot,id){return `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${top}"/><stop offset="1" stop-color="${bot}"/></linearGradient></defs><rect width="1200" height="600" fill="url(#${id})"/>`}
function hills(c1,c2){return `<path d="M0 400 Q200 330 420 380 T860 360 T1200 380 V600 H0Z" fill="${c1}"/><path d="M0 450 Q300 400 600 440 T1200 430 V600 H0Z" fill="${c2}"/>`}
function fields(){let s="";for(let i=0;i<9;i++){s+=`<path d="M${i*140-40} 600 L${560+i*12} 450" stroke="#a08a3a" stroke-width="3" opacity=".5"/>`}return s}
function cottage(x,y,s=1,c="#c9b9a0"){return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="0" y="-50" width="80" height="50" fill="${c}"/><path d="M-8 -48 L40 -90 L88 -48Z" fill="#7a6a3f"/><rect x="30" y="-28" width="16" height="28" fill="#4a3a2a"/><rect x="56" y="-40" width="14" height="12" fill="#e8d9a0"/></g>`}
function church(x,y){return `<g transform="translate(${x} ${y})"><rect x="0" y="-80" width="110" height="80" fill="#a9a095"/><rect x="80" y="-150" width="36" height="150" fill="#9b9287"/><path d="M76 -150 L98 -200 L120 -150Z" fill="#6a6258"/><path d="M-6 -78 L55 -120 L116 -78Z" fill="#6a6258"/><path d="M40 -40 a10 10 0 0 1 20 0 v40 h-20z" fill="#4a443c"/></g>`}
function chimney(x,y,h,smoke,c="#5a3a30"){let s=`<rect x="${x}" y="${y-h}" width="18" height="${h}" fill="${c}"/>`;if(smoke>0){for(let i=0;i<4;i++){s+=`<circle cx="${x+9+i*26}" cy="${y-h-14-i*18}" r="${14+i*7}" fill="#555" opacity="${smoke*(0.5-i*0.1)}"/>`}}return s}
function mill(x,y,w,f,c="#7b4a3a",lit=true,broken=false){let s=`<rect x="${x}" y="${y-f*34-10}" width="${w}" height="${f*34+10}" fill="${c}"/>`;for(let r=0;r<f;r++)for(let k=0;k<Math.floor(w/28);k++){const wx=x+10+k*28,wy=y-f*34+r*34;s+=`<rect x="${wx}" y="${wy}" width="14" height="20" fill="${broken&&(r+k)%3==0?"#111":(lit?"#e7c56a":"#3b3530")}" opacity="${lit?.9:.8}"/>`}return s}
function rowhouses(x,y,n,c="#6b5a52"){let s="";for(let i=0;i<n;i++){const h=60+(i%3)*8;s+=`<rect x="${x+i*46}" y="${y-h}" width="46" height="${h}" fill="${c}" stroke="#3a302c" stroke-width="2"/><rect x="${x+i*46+14}" y="${y-h+14}" width="12" height="14" fill="#2c2622"/><rect x="${x+i*46+30}" y="${y-h-16}" width="8" height="16" fill="#3a302c"/>`}return s}
function tower(x,y){return `<g transform="translate(${x} ${y})"><rect x="0" y="-260" width="60" height="260" fill="#8b7f68"/><rect x="-6" y="-270" width="72" height="16" fill="#6e634f"/><circle cx="30" cy="-220" r="20" fill="#e9e1c8" stroke="#4a4235" stroke-width="3"/><path d="M30 -220 L30 -234 M30 -220 L40 -216" stroke="#222" stroke-width="3"/><path d="M-4 -270 L30 -330 L64 -270Z" fill="#4f5a4c"/><rect x="70" y="-150" width="330" height="150" fill="#8b7f68"/>${[...Array(11)].map((_,i)=>`<rect x="${84+i*28}" y="-120" width="10" height="70" fill="#4b4336"/>`).join("")}</g>`}
function manor(x,y){return `<g transform="translate(${x} ${y})"><rect x="0" y="-150" width="360" height="150" fill="#cdbf9e"/><path d="M130 -150 L180 -200 L230 -150Z" fill="#b7a883"/>${[...Array(3)].map((_,r)=>[...Array(8)].map((_,k)=>`<rect x="${20+k*43}" y="${-135+r*45}" width="16" height="28" fill="${r==2&&k==3?"#5a4a3a":"#f2df9a"}"/>`).join("")).join("")}<rect x="-20" y="-6" width="400" height="6" fill="#9a8d70"/></g>`}
function tree(x,y,s=1){return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-5" y="-40" width="10" height="40" fill="#5a4630"/><circle cx="0" cy="-60" r="32" fill="#4d6b3f"/></g>`}
function person(x,y,c="#2a2a2a",s=1){return `<g transform="translate(${x} ${y}) scale(${s})" fill="${c}"><circle cx="0" cy="-34" r="6"/><rect x="-6" y="-28" width="12" height="20"/><rect x="-5" y="-8" width="4" height="8"/><rect x="1" y="-8" width="4" height="8"/></g>`}
function soldier(x,y){return `<g transform="translate(${x} ${y})"><rect x="-14" y="-40" width="34" height="18" fill="#3b2a22"/><rect x="-16" y="-24" width="4" height="24" fill="#3b2a22"/><rect x="14" y="-24" width="4" height="24" fill="#3b2a22"/><rect x="-2" y="-64" width="10" height="24" fill="#7a1e1e"/><circle cx="3" cy="-70" r="5" fill="#d8b9a0"/><rect x="-3" y="-84" width="12" height="10" fill="#111"/></g>`}
function crowd(x,y,n){let s="";for(let i=0;i<n;i++){s+=person(x+i*14+R(-4,4),y+R(-6,6),["#3a2f2a","#4a3d34","#2f2a33"][i%3],R(.8,1.1))}return s}

function panelSVG(kind,i){
  const t=tone(i), gid="g"+i;
  const top=mix("#8fb2d4","#6d6a70",t), bot=mix("#f1e3c0","#b9a58a",t);
  let s=`<svg viewBox="0 0 1200 600" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">`;
  switch(kind){
   case "title":
     s+=sky("#e7b98a","#f4dfb5",gid)+`<circle cx="920" cy="230" r="70" fill="#f6d68a" opacity=".8"/>`+hills("#8a9a5b","#a6ae6a")+fields()+cottage(150,470)+tree(330,470)+church(820,470)+tree(1050,470,1.2);break;
   case "village":
     s+=sky(top,bot,gid)+hills("#869656","#9ea564")+fields()+cottage(90,480)+cottage(260,470,.9)+tree(440,470)+church(920,470)+`<g transform="translate(730 470)"><rect x="0" y="-40" width="120" height="40" fill="#b99a5a"/><text x="60" y="-15" font-family="Georgia" font-size="16" text-anchor="middle" fill="#3a2a1a">BAKER</text></g>`;break;
   case "parish":
     s+=sky(top,bot,gid)+hills("#7f8d52","#95995e")+church(120,470)+`<g transform="translate(700 470)"><rect x="0" y="-110" width="260" height="110" fill="#b3a58c"/><path d="M-10 -108 L130 -160 L270 -108Z" fill="#6a5d48"/><text x="120" y="-70" font-family="Georgia" font-size="15" text-anchor="middle" fill="#2a2218">PARISH VESTRY</text><rect x="110" y="-50" width="40" height="50" fill="#3d342a"/></g>`+crowd(330,560,20)+cottage(1010,480);break;
   case "pamphlet":
     s+=sky(top,bot,gid)+hills("#7b8850","#8f935b")+rowhouses(60,480,6,"#9a8570")+`<g transform="translate(680 480)"><rect x="0" y="-130" width="300" height="130" fill="#a38f75"/><text x="105" y="-95" font-family="Georgia" font-size="15" text-anchor="middle" fill="#1f1a15">PRINTER · BOOKS</text><rect x="30" y="-75" width="80" height="60" fill="#e6d7ae"/><rect x="190" y="-75" width="80" height="60" fill="#e6d7ae"/></g>`+crowd(980,560,8)+[...Array(6)].map((_,k)=>`<rect x="${360+k*45}" y="${300+(k%2)*30}" width="26" height="34" fill="#f2ecd8" transform="rotate(${k*9-20} ${370+k*45} ${315})"/>`).join("");break;
   case "weavers":
     s+=sky(top,bot,gid)+hills("#737a50","#848658")+rowhouses(40,500,8,"#7a6758")+mill(480,500,320,4,"#86503e")+chimney(830,500,240,.6)+crowd(120,560,12);break;
   case "city":
     s+=sky(top,bot,gid)+`<rect y="420" width="1200" height="180" fill="#5e5650"/>`+mill(40,470,340,5,"#6e3f33")+chimney(400,470,300,.9)+mill(700,470,300,4,"#6e3f33")+chimney(1020,470,280,.9)+chimney(620,470,220,.8)+rowhouses(400,560,17,"#5a4a44")+`<rect y="560" width="1200" height="40" fill="#3d3632"/>`;break;
   case "counting":
     s+=sky(top,bot,gid)+`<rect y="420" width="1200" height="180" fill="#5a524c"/>`+mill(40,470,380,4,"#6e3f33")+chimney(430,470,280,.9)+`<g transform="translate(660 480)"><rect x="0" y="-190" width="420" height="190" fill="#b1a28a"/><text x="115" y="-160" font-family="Georgia" font-size="16" text-anchor="middle" fill="#1f1a15">COUNTING HOUSE</text>${[...Array(5)].map((_,k)=>`<rect x="${30+k*78}" y="-130" width="44" height="70" fill="#e9d79c"/>`).join("")}<rect x="190" y="-50" width="40" height="50" fill="#3d342a"/></g>`+`<rect y="560" width="1200" height="40" fill="#3d3632"/>`;break;
   case "luddite":
     s+=sky("#1c2033","#3a3550",gid)+`<circle cx="1030" cy="120" r="40" fill="#e9e3c9" opacity=".85"/><rect y="440" width="1200" height="160" fill="#26242e"/>`+mill(300,480,460,4,"#3e2c28",false,true)+chimney(780,480,260,.4,"#2f221e")+[...Array(5)].map((_,k)=>person(220+k*40,570,"#15131a",1.1)+`<circle cx="${226+k*40}" cy="${520}" r="8" fill="#f0a040" opacity=".9"/>`).join("");break;
   case "parliament":
     s+=sky(top,bot,gid)+`<rect y="460" width="1200" height="140" fill="#5f6b73"/>`+tower(240,480)+`<path d="M0 520 H1200" stroke="#8aa0ad" stroke-width="6" opacity=".6"/>`+chimney(900,470,200,.7)+chimney(980,470,240,.7)+mill(1020,470,180,3,"#5a3a30");break;
   case "peterloo":
     s+=sky(top,bot,gid)+`<rect y="430" width="1200" height="170" fill="#6a6152"/>`+rowhouses(0,450,26,"#5a4c44")+crowd(120,570,40)+crowd(730,575,8)+soldier(900,570)+soldier(960,570)+soldier(1020,570)+soldier(1080,570)+`<rect x="740" y="470" width="4" height="70" fill="#3a2a1a"/><rect x="744" y="470" width="90" height="36" fill="#e6dcc0"/><text x="789" y="494" font-family="Georgia" font-size="14" text-anchor="middle" fill="#7a1e1e">REFORM</text>`;break;
   case "estate":
     s+=sky(mix("#8fb2d4","#9aa0a6",.4),"#e6dcc0",gid)+hills("#7d9150","#96a55f")+tree(120,470,1.3)+manor(380,480)+tree(860,470,1.2)+tree(960,470,1.4)+`<path d="M1060 430 h120" stroke="#7a756c" stroke-width="2"/>`+chimney(1120,440,90,.5,"#7a6a60")+[...Array(4)].map((_,k)=>person(460+k*70,560,"#2a2a33",1)).join("");break;
   case "end":
     s+=sky("#7d7a82","#c7b69a",gid)+hills("#6d7650","#7f8757")+manor(620,480)+mill(40,480,300,4,"#6e3f33")+chimney(360,480,260,.9)+rowhouses(0,560,12,"#4e423d");break;
  }
  return s+`</svg>`;
}
function mix(a,b,t){const p=h=>[1,3,5].map(k=>parseInt(h.slice(k,k+2),16));const A=p(a),B=p(b);return"#"+A.map((v,k)=>Math.round(v+(B[k]-v)*t).toString(16).padStart(2,"0")).join("")}

/* ============ CHARACTERS ============ */
function laborerSVG(){return `<svg viewBox="0 0 90 200"><g><ellipse cx="45" cy="196" rx="28" ry="4" fill="#000" opacity=".25"/><rect x="28" y="130" width="12" height="62" fill="#4a3b2c"/><rect x="50" y="130" width="12" height="62" fill="#4a3b2c"/><rect x="24" y="186" width="18" height="8" fill="#231c16"/><rect x="48" y="186" width="18" height="8" fill="#231c16"/><path d="M22 70 h46 l4 66 h-54z" fill="#8a7a5e"/><path d="M30 70 h30 v60 h-30z" fill="#6b4a2b"/><rect x="14" y="74" width="10" height="54" fill="#8a7a5e"/><rect x="66" y="74" width="10" height="54" fill="#8a7a5e"/><circle cx="19" cy="132" r="6" fill="#d7a987"/><circle cx="71" cy="132" r="6" fill="#d7a987"/><rect x="38" y="58" width="14" height="14" fill="#d7a987"/><circle cx="45" cy="44" r="18" fill="#d7a987"/><path d="M25 38 q20 -22 42 -2 l6 4 h-50z" fill="#3a3a3a"/><rect x="40" y="70" width="10" height="6" fill="#b23a2a"/></g></svg>`}
function ownerSVG(as){const coat=as==="Landlord"?"#2f4a33":"#1f2638";const hat=as==="Landlord"?`<rect x="30" y="4" width="30" height="26" fill="#3a2f22"/><rect x="22" y="28" width="46" height="5" fill="#3a2f22"/>`:`<rect x="31" y="0" width="28" height="32" fill="#111"/><rect x="22" y="28" width="46" height="5" fill="#111"/>`;return `<svg viewBox="0 0 90 210"><g transform="translate(0 6)"><ellipse cx="45" cy="200" rx="30" ry="4" fill="#000" opacity=".25"/><rect x="29" y="130" width="12" height="64" fill="${as==="Landlord"?"#c9b58a":"#2a2a2a"}"/><rect x="49" y="130" width="12" height="64" fill="${as==="Landlord"?"#c9b58a":"#2a2a2a"}"/><rect x="26" y="${as==="Landlord"?160:188}" width="17" height="${as==="Landlord"?36:8}" fill="#1a1410"/><rect x="47" y="${as==="Landlord"?160:188}" width="17" height="${as==="Landlord"?36:8}" fill="#1a1410"/><path d="M18 70 h54 l6 84 h-14 l-4 -24 h-30 l-4 24 h-14z" fill="${coat}"/><path d="M34 70 h22 l-11 30z" fill="#f2efe6"/><rect x="42" y="100" width="6" height="30" fill="#c9a24a" opacity=".8"/><rect x="10" y="74" width="10" height="56" fill="${coat}"/><rect x="70" y="74" width="10" height="56" fill="${coat}"/><circle cx="15" cy="134" r="6" fill="#e8c4a6"/><circle cx="75" cy="134" r="6" fill="#e8c4a6"/><rect x="78" y="120" width="3" height="76" fill="#3a2a1a"/><rect x="38" y="58" width="14" height="14" fill="#e8c4a6"/><circle cx="45" cy="46" r="17" fill="#e8c4a6"/>${hat}</g></svg>`}

/* ============ STATE ============ */
let state=null, mode=null, myRoles=[], db=undefined, code=null, lastIdx=-1, ui={view:"home",err:""};
const pid=(()=>{try{let v=sessionStorage.getItem("malthus-pid");if(!v){v=Math.random().toString(36).slice(2,12);sessionStorage.setItem("malthus-pid",v)}return v}catch(e){return Math.random().toString(36).slice(2,12)}})();
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function meters(){
  let L=45,O=50;
  if(state&&state.choices){SCENES.forEach((sc,i)=>{const c=state.choices[i];if(c!==undefined&&c!==null){L+=sc.choices[c].d[0];O+=sc.choices[c].d[1]}})}
  return [Math.max(4,Math.min(100,L)),Math.max(4,Math.min(100,O))];
}

/* ============ RENDER ============ */
function buildStage(){
  $("#track").innerHTML=PANELS.map((k,i)=>`<div class="panel">${panelSVG(k,i)}</div>`).join("");
}
function panelIndex(){
  if(!state||state.phase==="lobby")return 0;
  if(state.phase==="end")return PANELS.length-1;
  return state.scene+1;
}
function renderStage(){
  const idx=panelIndex();
  $("#track").style.transform=`translateX(${-idx*100}%)`;
  if(idx!==lastIdx&&lastIdx!==-1){const c=$("#chars");c.classList.add("walk");clearTimeout(c._t);c._t=setTimeout(()=>c.classList.remove("walk"),1600)}
  lastIdx=idx;
  const sc=(state&&state.phase!=="end"&&state.phase!=="lobby")?SCENES[state.scene]:null;
  const ownerAs=sc?sc.ownerAs:(state&&state.phase==="end"?"Landlord":"Capitalist");
  const ended=state&&state.phase==="end";
  const act=sc?sc.actor:(ended?"owner":null);
  $("#chars").innerHTML=`<div class="fig ${act==="laborer"?"active":""} ${ended?"lose":""}">${laborerSVG()}<span class="tag">${ended?"":act==="laborer"?"▼ ":""}Laborer</span></div><div class="fig ${act==="owner"?"active":""} ${ended?"win":""}">${ownerSVG(ownerAs)}<span class="tag">${ended?"♛ ":act==="owner"?"▼ ":""}${ownerAs}</span></div>`;
  const p=$("#plate");
  if(sc){p.style.opacity=1;p.innerHTML=`<b>${sc.year} · ${esc(sc.place)}</b>${esc(sc.stat)}`}
  else if(state&&state.phase==="end"){p.style.opacity=1;p.innerHTML=`<b>1846</b>Corn Laws repealed. The capitalists take power from the landlords.`}
  else {p.style.opacity=1;p.innerHTML=`<b>England, 1790s</b>A two-player story built on Malthus's theories`}
  const mp=sc&&state.choices?state.choices[state.scene]:null;
  const mEl=$("#malthus");
  $("#victory").classList.toggle("show",!!ended);
  if(ended){$("#bubble").innerHTML="As nature intended: the proprietors prevail.<small>Thomas Robert Malthus</small>";mEl.classList.add("show")}
  else if(sc&&mp!==undefined&&mp!==null){$("#bubble").innerHTML=esc(MLINES[state.scene][mp])+"<small>Thomas Robert Malthus</small>";mEl.classList.add("show")}
  else mEl.classList.remove("show");
  const [L,O]=meters();
  $("#meters").innerHTML=state&&state.phase!=="lobby"?`<div class="meter">Laborer's bread<div class="bar"><i style="width:${L}%;background:#8e3b2c"></i></div></div><div class="meter">Owner's wealth<div class="bar"><i style="width:${O}%;background:#b8902f"></i></div></div>`:"";
}

function roleName(r){return r==="laborer"?"the Laborer":"the Owner"}

function render(){
  renderStage();
  const el=$("#content");
  if(!state){el.innerHTML=homeView();bindHome();return}
  if(state.phase==="lobby"){
        el.innerHTML=`<h2>Waiting for your partner</h2><p>Give them this code. They open this same page, choose <em>Join a game</em>, and enter it.</p><p class="bigcode">${esc(code)}</p><p>You are <strong>${roleName(myRoles[0])}</strong>. They'll play ${roleName(other(myRoles[0]))}.</p><p class="small">Keep this page open until they join. Once you're paired, nobody else can take a turn.</p>`;
    return;
  }
  if(state.phase==="end"){el.innerHTML=endView();$("#again").onclick=leave;return}
  const i=state.scene, sc=SCENES[i], pick=state.choices?state.choices[i]:undefined;
  const mine=myRoles.includes(sc.actor);
  const ownerLabel=`Owner (${sc.ownerAs})`;
  let h=`<p class="who">Scene ${i+1} of ${SCENES.length} · <strong>${sc.actor==="laborer"?"Laborer":ownerLabel}</strong> decides${mode==="online"?` · you are ${myRoles.map(r=>r==="owner"?"the Owner":"the Laborer").join(" & ")}`:""}</p>`;
  if(sc.swap)h+=`<p class="small">The owner changes hats. After 1815 the fight among owners is landlord against capitalist.</p>`;
  h+=`<h2>${esc(sc.title)}</h2><p class="context">${esc(sc.context)}</p><p class="prompt">${esc(sc.prompt)}</p><div class="choices">`;
  sc.choices.forEach((c,k)=>{h+=`<button class="choice ${pick===k?"picked":""}" data-k="${k}" ${(!mine||pick!==undefined&&pick!==null)?"disabled":""}>${esc(c.t)}</button>`});
  h+=`</div>`;
  if(pick===undefined||pick===null){
    if(!mine)h+=`<p class="waiting">Waiting for ${roleName(sc.actor)} to choose…</p>`;
  }else{
    const c=sc.choices[pick];
    h+=`<div class="outcome"><p>${esc(c.o)}</p></div>`;
    if(sc.quote)h+=`<p class="quote">“${esc(sc.quote)}”</p><p class="cite">${esc(sc.cite)}</p>`;
    h+=`<div class="lesson"><h3>Why Malthus says so</h3>${esc(sc.lesson)}</div>`;
    const next=SCENES[i+1];
    h+=`<button class="primary" id="next">${i===SCENES.length-1?"See how it ends":`Continue to ${next.year}`}</button>`;
  }
  el.innerHTML=h;
  el.querySelectorAll(".choice").forEach(b=>b.onclick=()=>choose(i,+b.dataset.k));
  const n=$("#next"); if(n)n.onclick=()=>advance(i);
}

function endView(){
  const [L,O]=meters();
  return `<h2 style="font-size:clamp(34px,7vw,52px);color:var(--brick)">The Owner wins. It was always going to.</h2>
  <p>Every path led here. The laborer's bread fell to ${Math.round(L)}; the owner's wealth rose to ${Math.round(O)}. That was the design: in Malthus's system, what the laborer chooses changes how he suffers, never whether he does.</p>
  <p>In 1846 Parliament repealed the Corn Laws, and the industrial capitalists finally took political power from the landlords. The owner changed hats one last time, but the laborer's side of the story didn't change.</p>
  <div class="lesson"><h3>What to take away</h3><ul class="take">
   <li>Population theory: people multiply faster than food, so most must live near subsistence, held there by restraint, vice, or misery.</li>
   <li>The class divide between owners and laborers is natural law. Relief and redistribution only make it worse.</li>
   <li>Theory of gluts: depressions come from too little demand. Malthus's fix was landlords' spending, not higher wages.</li>
   <li>The textbook's critique: his conclusions tracked his loyalty to the wealthy, especially landlords. His insight about demand outlived his defense of them, and returns with Keynes.</li></ul></div>
  <button class="primary" id="again">Play again</button>`;
}

function homeView(){
  if(ui.view==="create")return `<h2>Choose your side</h2><div class="roles"><button data-r="laborer"><strong>Laborer</strong><span>Moves first. Decides about family, work, and protest.</span></button><button data-r="owner"><strong>Owner</strong><span>Landlord or capitalist. Decides on wages, relief, and laws.</span></button></div>${ui.err?`<p class="err">${esc(ui.err)}</p>`:""}<button class="secondary" id="back">Back</button>`;
  if(ui.view==="join")return `<h2>Join a game</h2><p>Enter the code your partner gave you.</p><div class="row"><input class="code" id="codein" maxlength="5" autocomplete="off" aria-label="Game code"><button class="primary" style="margin-top:0" id="joinbtn">Join</button></div>${ui.err?`<p class="err">${esc(ui.err)}</p>`:""}<p><button class="secondary" id="back">Back</button></p>`;
  return `<h2>The Lottery of Life</h2>
  <p>England, 1795 to 1820. One player is a laborer, the other an owner: first a landlord, then a mill-owning capitalist, then a landlord again. You take turns making choices through ten scenes. Every outcome follows Thomas Robert Malthus's theories.</p>
  <p class="small">Malthus claimed that in the great lottery of life, some are born to draw a blank. Let's see who draws it.</p>
  <div class="row" style="margin-top:18px"><button class="primary" style="margin-top:0" id="create" ${db?"":"disabled"}>Create a game</button><button class="secondary" id="join" ${db?"":"disabled"}>Join a game</button><button class="secondary" id="local">Play on one device</button></div>
  <p class="small" id="dbnote">${db===null?"Online play isn't set up on this copy. You can still play on one device.":db?"":"Connecting…"}</p>`;
}
function bindHome(){
  const b=id=>document.getElementById(id);
  if(b("create"))b("create").onclick=()=>{ui={view:"create",err:""};render()};
  if(b("join"))b("join").onclick=()=>{ui={view:"join",err:""};render()};
  if(b("local"))b("local").onclick=startLocal;
  if(b("back"))b("back").onclick=()=>{ui={view:"home",err:""};render()};
  document.querySelectorAll(".roles button").forEach(x=>x.onclick=()=>createGame(x.dataset.r));
  if(b("joinbtn")){const go=()=>joinGame(b("codein").value);b("joinbtn").onclick=go;b("codein").onkeydown=e=>{if(e.key==="Enter")go()};b("codein").focus()}
}

/* ============ GAME LOGIC (live sync via room presence) ============ */
let room=null, me=null, partnerPeer=null;
function fresh(){return{seats:{laborer:null,owner:null},scene:0,phase:"lobby",choices:{},created:Date.now()}}
function startLocal(){mode="local";myRoles=["laborer","owner"];state=fresh();state.phase="choose";render()}
function other(r){return r==="laborer"?"owner":"laborer"}
function myPeerId(){const p=room.peers().find(x=>x.isMe&&x.sameTab);return p?p.peer:null}
function save(){try{sessionStorage.setItem("malthus-game",JSON.stringify(me))}catch(e){}}
function push(){save();room.presence({g:me.g,role:me.role,picks:me.picks,scene:me.scene,end:me.end,with:me.with||null}).catch(()=>{})}
function findPartner(){
  const mine=myPeerId();
  const c=room.peers().filter(p=>!p.sameTab&&p.presence&&p.presence.g===me.g&&p.presence.role===other(me.role));
  const ok=c.filter(p=>!p.presence.with||p.presence.with===mine);
  if(partnerPeer){const same=ok.find(p=>p.peer===partnerPeer);if(same)return same}
  return ok[0]||null;
}
function derive(){
  const pt=findPartner();
  if(pt&&me.with!==pt.peer){me.with=pt.peer;partnerPeer=pt.peer;push()}
  if(!pt){state={seats:{},scene:me.scene,phase:"lobby",choices:{}};return}
  const pp=pt.presence, choices={};
  SCENES.forEach((sc,i)=>{const src=sc.actor===me.role?me.picks:(pp.picks||{});if(src&&src[i]!=null)choices[i]=src[i]});
  const scene=Math.min(SCENES.length-1,Math.max(me.scene||0,pp.scene||0));
  state={seats:{},scene,phase:(me.end||pp.end)?"end":"choose",choices};
  if(scene>me.scene){me.scene=scene;save()}
}
function refresh(){if(mode!=="online")return;derive();render()}
async function write(patch){ // local mode only
  deepMerge(state,patch);render();
}
function deepMerge(t,p){for(const k in p){if(p[k]&&typeof p[k]==="object"&&!Array.isArray(p[k])){t[k]=t[k]||{};deepMerge(t[k],p[k])}else t[k]=p[k]}}
async function choose(i,k){
  if(state.scene!==i||(state.choices&&state.choices[i]!=null))return;
  if(mode==="local")return write({choices:{[i]:k}});
  if(SCENES[i].actor!==me.role)return;
  me.picks={...me.picks,[i]:k};push();refresh();
}
async function advance(i){
  if(mode==="local"){if(i>=SCENES.length-1)return write({phase:"end"});return write({scene:i+1})}
  if(state.scene!==i)return;
  if(i>=SCENES.length-1)me.end=true;else me.scene=i+1;
  push();refresh();
}
function genCode(){const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";for(let i=0;i<5;i++)s+=a[Math.floor(Math.random()*a.length)];return s}
function codeTaken(c){return room.peers().some(p=>!p.sameTab&&p.presence&&p.presence.g===c)}
function begin(c,role){
  mode="online";code=c;myRoles=[role];me={g:c,role,picks:{},scene:0,end:false,with:null};partnerPeer=null;push();refresh();
}
async function createGame(role){
  let c;do{c=genCode()}while(codeTaken(c));
  begin(c,role);
}
async function joinGame(raw){
  const c=String(raw||"").trim().toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(c.length!==5){ui.err="Codes are 5 characters.";render();return}
  ui.err="";$("#content").insertAdjacentHTML("beforeend",'<p class="small" id="looking">Looking for that game…</p>');
  let hosts=[];
  for(let t=0;t<12;t++){hosts=room.peers().filter(p=>!p.sameTab&&p.presence&&p.presence.g===c);if(hosts.length)break;await new Promise(r=>setTimeout(r,250))}
  if(!hosts.length){ui.err="No open game with that code. Make sure your partner still has the game open.";render();return}
  const roles=hosts.map(p=>p.presence.role);
  const free=["laborer","owner"].find(r=>!roles.includes(r));
  if(!free){ui.err="That game already has two players.";render();return}
  begin(c,free);
}
function leave(){if(me){me=null;try{sessionStorage.removeItem("malthus-game")}catch(e){}room&&room.presence({g:null,role:null,picks:null,scene:null,end:null,with:null}).catch(()=>{})}state=null;mode=null;myRoles=[];code=null;partnerPeer=null;ui={view:"home",err:""};render()}

/* ============ SUPABASE REALTIME ADAPTER (same shape as room) ============ */
function makeSupaRoom(){
  const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  const key=pid+"-"+Math.random().toString(36).slice(2,6);
  const ch=sb.channel("malthus-lobby",{config:{presence:{key}}});
  let mine={},snap=[],ready=false;const hs=[];
  function build(){
    const st=ch.presenceState();
    snap=Object.keys(st).map(k=>{const m=st[k][st[k].length-1]||{};const {presence_ref,...p}=m;return{peer:k,isMe:k===key,sameTab:k===key,presence:p}});
    if(!snap.some(p=>p.sameTab))snap.unshift({peer:key,isMe:true,sameTab:true,presence:mine});
    hs.forEach(f=>f({peers:snap}));
  }
  ch.on("presence",{event:"sync"},build).subscribe(s=>{if(s==="SUBSCRIBED"){ready=true;ch.track(mine);build()}});
  return{
    peers:()=>snap,
    onPeers:f=>{hs.push(f);return()=>{}},
    presence:async patch=>{mine={...mine,...patch};for(const k in mine)if(mine[k]===null)delete mine[k];if(ready)await ch.track(mine);build()}
  };
}

/* ============ BOOT ============ */
buildStage();render();
(async()=>{
  if(SUPABASE_URL&&SUPABASE_ANON_KEY&&!SUPABASE_ANON_KEY.startsWith("PASTE")&&window.supabase){try{room=makeSupaRoom()}catch(e){room=null}}
  else{try{room=window.claude&&window.claude.use?await window.claude.use("room"):null}catch(e){room=null}}
  db=room; // enables the online buttons
  if(room){
    room.onPeers(()=>refresh(),()=>{});
    // rejoin after a reload in this tab
    try{const s=JSON.parse(sessionStorage.getItem("malthus-game")||"null");if(s&&s.g){mode="online";code=s.g;myRoles=[s.role];me=s;push();setTimeout(refresh,800)}}catch(e){}
  }
  if(!state)render();
})();
</script>
